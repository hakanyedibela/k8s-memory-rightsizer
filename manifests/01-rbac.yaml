---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rightsizer
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rightsizer
  namespace: default
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rightsizer
  namespace: default
subjects:
- kind: ServiceAccount
  name: rightsizer
  namespace: default
roleRef:
  kind: Role
  name: rightsizer
  apiGroup: rbac.authorization.k8s.io
